global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service_group: zaeon-agent

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  # API do agent-gateway expõe /metrics (prometheus_client) — ver app/api/main.py
  - job_name: zaeon_agent_api
    static_configs:
      - targets: ["agent-api:8000"]
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: zaeon-agent-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # TODO(pausa): quando o worker/inbound expuserem :9100 /metrics, adicionar:
  #   - job_name: zaeon_agent_worker
  #     static_configs: [{ targets: ["agent-worker:9100"] }]
