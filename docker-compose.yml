# Compose-raiz do produto Zaeon (deploy). Web + Agent Gateway + infra + observabilidade.
# Sobe na VPS:  docker compose up -d --build
#
# Secrets vão no .env da VPS (NÃO commitar). Mongo é Atlas externo (DATABASE_URL).
# `adapter` (whatsmeow Go dedicado) entra quando o lado Go estiver pronto (ADR-001).

services:
  # ───────────── web (Next + Socket.IO) ─────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* são embutidas no build → vêm do .env como build-args.
      # (PUSHER_SECRET NÃO entra aqui; é server-only, fica só no env_file de runtime.)
      args:
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
    container_name: zaeon_web
    env_file: [.env]                       # DATABASE_URL (Atlas), NEXTAUTH, etc.
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    # Não publica 3000 na internet: quem expõe é o Caddy (80/443) na frente.
    # Para debug direto no VPS use `docker compose exec` ou um túnel SSH.
    expose: ["3000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ───────────── agent-gateway ─────────────
  agent-api:
    build: { context: ./agent-gateway, dockerfile: Dockerfile }
    container_name: zaeon_agent_api
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://zaeon:${POSTGRES_PASSWORD:-zaeon}@postgres/zaeon_agent
      REDIS_URL: redis://redis:6379/0
      BRIDGE_REDIS_URL: redis://redis-bridge:6380/0
    depends_on: [postgres, redis, redis-bridge]
    ports: ["8000:8000"]
    restart: unless-stopped

  agent-worker:
    build: { context: ./agent-gateway, dockerfile: Dockerfile }
    container_name: zaeon_agent_worker
    command: ["python", "-m", "arq", "app.worker.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://zaeon:${POSTGRES_PASSWORD:-zaeon}@postgres/zaeon_agent
      REDIS_URL: redis://redis:6379/0
      BRIDGE_REDIS_URL: redis://redis-bridge:6380/0
    depends_on: [postgres, redis, redis-bridge]
    restart: unless-stopped

  agent-inbound:
    build: { context: ./agent-gateway, dockerfile: Dockerfile }
    container_name: zaeon_agent_inbound
    command: ["python", "-m", "app.worker.inbound_runner"]
    env_file: [.env]
    environment:
      BRIDGE_REDIS_URL: redis://redis-bridge:6380/0
    depends_on: [redis-bridge]
    restart: unless-stopped

  # ───────────── infra ─────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zaeon_postgres
    environment:
      POSTGRES_USER: zaeon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaeon}
      POSTGRES_DB: zaeon_agent
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./agent-gateway/migrations/001_pgvector.sql:/docker-entrypoint-initdb.d/001_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaeon"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zaeon_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped

  redis-bridge:
    image: redis:7-alpine
    container_name: zaeon_redis_bridge
    command: ["redis-server", "--port", "6380"]
    restart: unless-stopped

  # ───────────── observabilidade ─────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: zaeon_prometheus
    volumes:
      - ./agent-gateway/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./agent-gateway/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: zaeon_loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["loki_data:/loki"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: zaeon_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./agent-gateway/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./agent-gateway/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki]
    ports: ["3001:3000"]
    restart: unless-stopped

  # ───────────── proxy reverso + HTTPS automático (Caddy) ─────────────
  # Único serviço público (80/443). Faz TLS automático via Let's Encrypt e
  # encaminha pro web:3000 (com upgrade de WebSocket pro Socket.IO de fábrica).
  caddy:
    image: caddy:2-alpine
    container_name: zaeon_caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      BETA_DOMAIN: ${BETA_DOMAIN:-beta.zaeon.space}
      ACME_EMAIL: ${ACME_EMAIL:-admin@zaeon.space}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  # adapter:   # whatsmeow Go dedicado pro Zaeon — publica wa:evt (ADR-001, tarefa #13)

volumes:
  pg_data:
  redis_data:
  prom_data:
  loki_data:
  grafana_data:
  caddy_data:
  caddy_config:
