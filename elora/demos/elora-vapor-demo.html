  /* Ponto de origem do vapor: a boca da xícara (em % da imagem) */
  .vapor {
    position: absolute;
    left: 34.4%;
    top: 58%;
  }

  /* Cada fio de vapor é uma mancha branca, desfocada e translúcida */
  .vapor span {
    position: absolute;
    left: -1.2vw;
    bottom: 0;
    width: 1.8vw;
    height: 7vw;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
                rgb(255 255 255 / 0.9), rgb(255 255 255 / 0.25) 45%, transparent 70%);
    filter: blur(0.35vw);
    opacity: 0;
    animation: subir 4.5s ease-out infinite;
  }

  /* Atrasos diferentes: os fios não sobem todos juntos */
  .vapor span:nth-child(2) { animation-delay: 1.5s; left: -0.4vw; }
  .vapor span:nth-child(3) { animation-delay: 3s;   left: -2vw; }

  @keyframes subir {
    0%   { opacity: 0;   transform: translateY(0)     translateX(0)     scaleX(0.6); }
    25%  { opacity: 0.9; }
    50%  {               transform: translateY(-5vw)  translateX(0.8vw) scaleX(1.1); }
    100% { opacity: 0;   transform: translateY(-11vw) translateX(-0.6vw) scaleX(1.8); }
  }

  /* Acessibilidade: sem animação para quem pediu menos movimento */
  @media (prefers-reduced-motion: reduce) {
    .vapor span { animation: none; }
  }
</style>
</head>
<body>
  <div class="cena">
    <div class="vapor" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </div>
</body>
