<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zaeon — marco cósmico (protótipo)</title>
<style>
  html,body{margin:0;height:100%;background:#03030a;overflow:hidden;font:13px/1.4 system-ui,sans-serif;color:#cfe0ff}
  #hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:5;background:rgba(14,12,36,.5);border:1px solid rgba(150,130,255,.25);padding:6px 14px;border-radius:999px;color:#aab8e8}
  #cap{position:fixed;left:14px;bottom:12px;z-index:5;max-width:min(360px,80vw);background:rgba(12,10,32,.55);border:1px solid rgba(150,130,255,.25);padding:9px 12px;border-radius:12px}
  #cap b{color:#9fe8ff}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:#03030a;color:#8fa6d8;transition:opacity .5s}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="load">carregando o marco…</div>
<div id="hint">arraste pra orbitar · scroll/pinça pra aproximar</div>
<div id="cap"><b>Zaeon</b> — muralhas de granizo, casa de cristal, línguas de fogo contidas, contraste térmico frio×quente. Flutua; a base do dono fica no topo.</div>
<script type="module">
import * as THREE from 'three';
const W=()=>innerWidth,H=()=>innerHeight;
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.setSize(W(),H());R.autoClear=false;R.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(R.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,W()/H(),.1,2000);
function glowTex(c0,c1){const s=128,cs=document.createElement('canvas');cs.width=cs.height=s;const g=cs.getContext('2d');const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,c0);gr.addColorStop(.4,c1);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cs);}
const starTex=glowTex('rgba(255,255,255,1)','rgba(190,215,255,.5)');

/* ===== fundo: nebulosa (shader) numa cena ortográfica ===== */
const bgScene=new THREE.Scene(),bgCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const NEB_VERT=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;
const NEB_FRAG=`varying vec2 vUv;uniform float uTime,uAspect;
 float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float noise(vec2 p){vec2 i=floor(p),f=fract(p);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));vec2 u=f*f*(3.-2.*f);return mix(a,b,u.x)+(c-a)*u.y*(1.-u.x)+(d-b)*u.x*u.y;}
 float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.02;a*=.55;}return v;}
 vec3 pal(float t){vec3 a=vec3(.30,.10,.55),b=vec3(.55,.18,.95),c=vec3(.35,.78,1.);vec3 col=mix(a,b,smoothstep(0.,.6,t));return mix(col,c,smoothstep(.5,1.,t));}
 void main(){vec2 uv=vUv*2.-1.;uv.x*=1.6*uAspect;uv.y*=1.2;float t=uTime*.03;vec2 cc=vec2(0,.4);cc.x*=1.6*uAspect;cc.y*=1.2;vec2 d=uv-cc;float rr=length(d);
  vec2 p=d*1.4+.4;vec2 q=vec2(fbm(p+vec2(0,t)),fbm(p+vec2(5.2,-t)));float neb=fbm(p+3.5*q);
  float radial=smoothstep(1.3,.08,rr);float glow=smoothstep(.35,.95,neb)*radial;vec3 col=pal(neb)*(.35+.75*glow);
  gl_FragColor=vec4(col,(0.6*glow+0.3*neb*radial)*0.95);}`;
const nebMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,vertexShader:NEB_VERT,fragmentShader:NEB_FRAG,uniforms:{uTime:{value:0},uAspect:{value:W()/H()}}});
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),nebMat));

/* ===== luzes ===== */
scene.add(new THREE.HemisphereLight(0x6677bb,0x0a0a16,.9));
const key=new THREE.DirectionalLight(0x99bbff,.6);key.position.set(6,12,8);scene.add(key);
const fireLight=new THREE.PointLight(0xff8a3c,1.4,60);fireLight.position.set(0,9,0);scene.add(fireLight);
const coldLight=new THREE.PointLight(0x7fe9ff,1.1,40);coldLight.position.set(0,13,0);scene.add(coldLight);

/* ===== estrelas ===== */
{const N=1200,pv=new Float32Array(N*3);for(let i=0;i<N;i++){const u=Math.random(),v=Math.random(),th=u*6.283,ph=Math.acos(2*v-1),r=180*Math.cbrt(Math.random());pv[i*3]=r*Math.sin(ph)*Math.cos(th);pv[i*3+1]=Math.abs(r*Math.sin(ph)*Math.sin(th))*.9+6;pv[i*3+2]=r*Math.cos(ph);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pv,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.9,map:starTex,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending})));}

/* ===== buraco negro (fundo, estilo filme) ===== */
{const bh=new THREE.Group();bh.position.set(44,30,-150);bh.add(new THREE.Mesh(new THREE.SphereGeometry(6,40,40),new THREE.MeshBasicMaterial({color:0})));
 const dm=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
 const disk=new THREE.Group();[[6.6,15,0xffe3b0,.85],[6.6,11,0xffb45a,.8],[6.6,8.6,0xff7a2c,.7]].forEach(([a,b,c,o])=>disk.add(new THREE.Mesh(new THREE.RingGeometry(a,b,160),dm(c,o))));disk.rotation.x=-Math.PI/2+.06;bh.add(disk);
 bh.add(new THREE.Mesh(new THREE.RingGeometry(6,6.6,120),dm(0xfff0d6,.95)));scene.add(bh);}

/* =====================================================================
   ZAEON — a estrutura flutuante (preset "zaeon")
   ===================================================================== */
const zaeon=new THREE.Group();zaeon.position.set(0,7,0);scene.add(zaeon);

// paleta: gelo/cristal frio + fogo quente (mesma do disco de acreção)
const COLD=0xbfe8ff, ICE=0x9fd0ff, FIRE=[0xffe3b0,0xffb45a,0xff7a2c];

// --- ilha-base de cristal (octógono invertido, como uma montanha flutuante de gelo) ---
const islandMat=new THREE.MeshPhysicalMaterial({color:0x0b1a30,emissive:0x10325e,emissiveIntensity:.5,roughness:.35,metalness:.1,transmission:.25,thickness:1,transparent:true,opacity:.96});
const island=new THREE.Mesh(new THREE.ConeGeometry(9,7,8,1,false),islandMat);island.position.y=-3.5;island.rotation.y=Math.PI/8;zaeon.add(island);
// brilho frio por baixo (assenta a flutuação)
const under=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex('rgba(150,230,255,.6)','rgba(60,120,220,.15)'),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));under.scale.set(26,26,1);under.position.y=-7;zaeon.add(under);

// --- piso interno (contraste térmico: frio) ---
const floorI=new THREE.Mesh(new THREE.CylinderGeometry(6.4,6.4,.3,8),new THREE.MeshStandardMaterial({color:0x0a2440,emissive:COLD,emissiveIntensity:.6,roughness:.6,metalness:.2,transparent:true,opacity:.9}));floorI.rotation.y=Math.PI/8;zaeon.add(floorI);

// --- muralhas de granizo (anel de blocos cristalinos translúcidos) ---
const wallMat=new THREE.MeshPhysicalMaterial({color:0xcfe9ff,emissive:ICE,emissiveIntensity:.25,roughness:.1,metalness:0,transmission:.9,thickness:.8,transparent:true,opacity:.6,side:THREE.DoubleSide});
const NW=16;for(let i=0;i<NW;i++){const a=i/NW*Math.PI*2,r=6.3;const h=2.4+(i%2?1:.4);const b=new THREE.Mesh(new THREE.BoxGeometry(1.5,h,.7),wallMat);b.position.set(Math.cos(a)*r,.3+h/2,Math.sin(a)*r);b.rotation.y=-a;zaeon.add(b);}
// arestas vivas das muralhas (wireframe frio)
const wallEdge=new THREE.Mesh(new THREE.TorusGeometry(6.3,.06,6,48),new THREE.MeshBasicMaterial({color:COLD,transparent:true,opacity:.5,blending:THREE.AdditiveBlending}));wallEdge.rotation.x=Math.PI/2;wallEdge.position.y=2.2;zaeon.add(wallEdge);

// --- casa de cristal (pavilhão central: pilares + cúpula estelar) ---
const house=new THREE.Group();house.position.y=.3;zaeon.add(house);
const pillarMat=new THREE.MeshPhysicalMaterial({color:0xdff0ff,emissive:ICE,emissiveIntensity:.35,roughness:.08,metalness:0,transmission:.85,thickness:.6,transparent:true,opacity:.7});
const NP=6;for(let i=0;i<NP;i++){const a=i/NP*Math.PI*2,r=3.4;const p=new THREE.Mesh(new THREE.CylinderGeometry(.22,.26,4.2,6),pillarMat);p.position.set(Math.cos(a)*r,2.1,Math.sin(a)*r);house.add(p);}
// cúpula (teto imitando o caminho das estrelas/relâmpagos)
const domeMat=new THREE.MeshPhysicalMaterial({color:0x0a1830,emissive:0x2a4a80,emissiveIntensity:.5,roughness:.2,metalness:.3,transmission:.4,thickness:1,transparent:true,opacity:.55,side:THREE.DoubleSide});
const dome=new THREE.Mesh(new THREE.SphereGeometry(3.9,24,16,0,Math.PI*2,0,Math.PI/2),domeMat);dome.position.y=4.2;house.add(dome);
// linhas de "relâmpago"/caminho estelar sob a cúpula
{const seg=[];for(let k=0;k<40;k++){const a=Math.random()*6.283,ph=Math.random()*Math.PI/2,r=3.7;const x=Math.cos(a)*Math.sin(ph)*r,y=4.2+Math.cos(ph)*r*0+Math.sin(ph)*0+Math.cos(ph)*r*0;seg.push(Math.cos(a)*Math.cos(ph)*r, 4.2+Math.sin(ph)*r*0.0+ (1-Math.cos(ph))*0, Math.sin(a)*Math.cos(ph)*r);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(seg),3));house.add(new THREE.Points(g,new THREE.PointsMaterial({size:.14,map:starTex,color:0xbfe8ff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})));}

// --- querubins: pontos de luz orbitando devagar ---
const cherub=[];{const CN=90,cp=new Float32Array(CN*3);for(let i=0;i<CN;i++){cherub.push({a:Math.random()*6.283,r:3+Math.random()*3.5,y:1.5+Math.random()*4,sp:.1+Math.random()*.25});}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(cp,3));const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.18,map:starTex,color:0xeaf4ff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));zaeon.add(pts);window.__cherubGeo=g;}

// --- línguas de fogo (sprites quentes lambendo as muralhas; cintilar LENTO, sem estrobo) ---
const fires=[];const NF=18;for(let i=0;i<NF;i++){const a=i/NF*Math.PI*2,r=6.7;const mat=new THREE.SpriteMaterial({map:glowTex('rgba(255,225,170,.95)','rgba(255,120,40,.3)'),color:FIRE[i%3],transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});const s=new THREE.Sprite(mat);s.position.set(Math.cos(a)*r,1.6,Math.sin(a)*r);s.scale.set(2.2,3.2,1);zaeon.add(s);fires.push({s,ph:Math.random()*6.283,bx:s.scale.x,by:s.scale.y});}
// anel de brasa quente na borda (contraste com o piso frio)
const ember=new THREE.Mesh(new THREE.TorusGeometry(6.7,.12,8,64),new THREE.MeshBasicMaterial({color:0xff7a2c,transparent:true,opacity:.6,blending:THREE.AdditiveBlending}));ember.rotation.x=Math.PI/2;ember.position.y=.4;zaeon.add(ember);

// --- plataforma do TOPO: a base do dono (flutua junto, parentada ao group) ---
const topo=new THREE.Group();topo.position.y=6.6;zaeon.add(topo);
const plat=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.6,.25,32),new THREE.MeshStandardMaterial({color:0x10213e,emissive:0x2b6bd0,emissiveIntensity:.6,roughness:.4,metalness:.3}));topo.add(plat);
const platRing=new THREE.Mesh(new THREE.TorusGeometry(2.5,.05,8,48),new THREE.MeshBasicMaterial({color:0x5fd0ff,transparent:true,opacity:.7,blending:THREE.AdditiveBlending}));platRing.rotation.x=Math.PI/2;platRing.position.y=.13;topo.add(platRing);
// computador holográfico (marcando que é a base de estudo do dono)
const scr=new THREE.Mesh(new THREE.PlaneGeometry(1.5,.9),new THREE.MeshBasicMaterial({color:0x66e6ff,transparent:true,opacity:.35,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));scr.position.set(0,1.1,-.7);topo.add(scr);
const scrEdge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.5,.9)),new THREE.LineBasicMaterial({color:0x9fe8ff,transparent:true,opacity:.9}));scrEdge.position.copy(scr.position);topo.add(scrEdge);
// avatar do dono (ser de luz com regalia: núcleo + aura + "coroa")
const owner=new THREE.Group();owner.position.set(0,.9,.4);topo.add(owner);
owner.add(new THREE.Mesh(new THREE.CapsuleGeometry(.28,.7,6,12),new THREE.MeshStandardMaterial({color:0x07131c,emissive:0x45d6ff,emissiveIntensity:1.5,roughness:.4,metalness:0,transparent:true,opacity:.9})));
const aura=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex('rgba(120,220,255,.7)','rgba(60,140,255,.15)'),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));aura.scale.set(2.4,2.4,1);aura.position.y=.4;owner.add(aura);
const crown=new THREE.Mesh(new THREE.TorusGeometry(.26,.04,6,16),new THREE.MeshBasicMaterial({color:0xfff0d6,transparent:true,opacity:.95,blending:THREE.AdditiveBlending}));crown.rotation.x=Math.PI/2;crown.position.y=.95;owner.add(crown);
// feixe conectando o topo à casa (neurônios subindo, estilo cérebro)
const beam=[];{const BN=120,bp=new Float32Array(BN*3);for(let i=0;i<BN;i++)beam.push({a:Math.random()*6.283,r:.2+Math.random()*1.2,y:Math.random()*6.4,sp:.4+Math.random()*1.2,dr:Math.random()<.5?1:-1});const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(bp,3));const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.12,map:starTex,color:0x8fe8ff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));zaeon.add(pts);window.__beamGeo=g;window.__beam=beam;}

/* ===== câmera orbital ===== */
let az=0.6,pitch=0.5,dist=34;const tgt=new THREE.Vector3(0,7,0);
function placeCam(){const cp=Math.cos(pitch),sp=Math.sin(pitch);cam.position.set(tgt.x+Math.sin(az)*cp*dist,tgt.y+sp*dist,tgt.z+Math.cos(az)*cp*dist);cam.lookAt(tgt);}
let drag=null;R.domElement.addEventListener('pointerdown',e=>drag={x:e.clientX,y:e.clientY,az,pitch});
addEventListener('pointermove',e=>{if(!drag)return;az=drag.az-(e.clientX-drag.x)*.006;pitch=Math.max(-.2,Math.min(1.35,drag.pitch+(e.clientY-drag.y)*.006));});
addEventListener('pointerup',()=>drag=null);
addEventListener('wheel',e=>{dist=Math.max(14,Math.min(90,dist+e.deltaY*.03));},{passive:true});
let pinch=0;addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.hypot(dx,dy);if(pinch)dist=Math.max(14,Math.min(90,dist+(pinch-d)*.05));pinch=d;}},{passive:true});
addEventListener('touchend',()=>pinch=0);

/* ===== loop ===== */
const clock=new THREE.Clock();
function loop(){const dt=clock.getDelta(),t=clock.elapsedTime;
 nebMat.uniforms.uTime.value+=dt;nebMat.uniforms.uAspect.value=W()/H();
 // flutuação lenta
 zaeon.position.y=7+Math.sin(t*.5)*.4;zaeon.rotation.y+=dt*.03;
 // fogo: cintilar LENTO (sem estrobo)
 fires.forEach(f=>{const p=.72+.28*Math.sin(t*1.8+f.ph);f.s.scale.set(f.bx*(.9+p*.25),f.by*(.8+p*.4),1);f.s.material.opacity=.55+.3*p;});
 fireLight.intensity=1.2+.3*Math.sin(t*1.6);ember.material.opacity=.5+.15*Math.sin(t*1.4);
 // querubins orbitando
 {const a=window.__cherubGeo.attributes.position.array;cherub.forEach((c,i)=>{c.a+=dt*c.sp;a[i*3]=Math.cos(c.a)*c.r;a[i*3+1]=c.y+Math.sin(t*.6+i)*.15;a[i*3+2]=Math.sin(c.a)*c.r;});window.__cherubGeo.attributes.position.needsUpdate=true;}
 // neurônios subindo no feixe do topo
 {const a=window.__beamGeo.attributes.position.array,B=window.__beam;for(let i=0;i<B.length;i++){const d=B[i];d.y+=d.sp*dt;if(d.y>6.6){d.y=0;d.a=Math.random()*6.283;}const rr=d.r*(.4+d.y*.09),ang=d.a+d.y*d.dr*.4;a[i*3]=Math.cos(ang)*rr;a[i*3+1]=d.y;a[i*3+2]=Math.sin(ang)*rr;}window.__beamGeo.attributes.position.needsUpdate=true;}
 owner.rotation.y+=dt*.5;crown.rotation.z+=dt*.8;
 placeCam();
 R.clear();R.render(bgScene,bgCam);R.clearDepth();R.render(scene,cam);
 requestAnimationFrame(loop);
}
placeCam();loop();
const ld=document.getElementById('load');ld.style.opacity=0;setTimeout(()=>ld.remove(),600);
addEventListener('resize',()=>{R.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix();});
</script></body></html>
