name: CI

# Verificação contínua: instala, gera Prisma, lint (não-bloqueante), testes e build.
# O build aqui é a real checagem que o sandbox de dev não consegue rodar (Next build longo).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

# Cancela runs antigos do mesmo ref quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Envs de placeholder só p/ o build não quebrar (sem segredos reais).
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "mongodb://placeholder:27017/build"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-in-prod"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint (não-bloqueante)
        run: npm run lint
        continue-on-error: true

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npx next build
